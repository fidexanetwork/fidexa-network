<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>FIDEXA Network</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- AdsGram -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #07111f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .card {
      background: #0d1b2d;
      border: 1px solid #18304a;
      border-radius: 18px;
    }

    .blue-card {
      background: linear-gradient(145deg, #0d3154, #092238);
      border: 1px solid #15558a;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: #081522;
      border-top: 1px solid #18304a;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    }

    .nav-grid {
      max-width: 520px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: #71849a;
      padding: 7px 2px;
      border-radius: 12px;
      font-size: 11px;
    }

    .nav-btn.active {
      color: #35a9ff;
      background: #0d263d;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      background: #148de2;
      color: white;
      font-weight: 700;
      font-size: 15px;
    }

    .primary-btn:disabled {
      opacity: 0.45;
    }

    .secondary-btn {
      border: 1px solid #245274;
      background: #0b2033;
      color: #d9edff;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 600;
    }

    .timer {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #12263b;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22a7ff;
      transition: width 0.5s linear;
    }

    .ad-box {
      min-height: 130px;
      border: 1px dashed #31536f;
      background: #091827;
      border-radius: 16px;
      padding: 15px;
    }

    .small {
      color: #7890a8;
      font-size: 12px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
    }

    .balance {
      font-size: 34px;
      font-weight: 800;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #25d366;
      display: inline-block;
      margin-right: 5px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 40px);
      max-width: 420px;
      background: #102338;
      border: 1px solid #27506f;
      border-radius: 13px;
      padding: 13px 15px;
      text-align: center;
      font-size: 13px;
      display: none;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="px-4 pt-5 pb-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div>
        <div class="text-xl font-extrabold tracking-wide">FIDEXA</div>
        <div class="small">Decentralized digital ecosystem</div>
      </div>

      <div class="text-right">
        <div class="text-xs text-slate-400">Network</div>
        <div class="text-sm font-bold">
          <span class="status-dot"></span>Online
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4">

    <!-- ================= HOME ================= -->
    <section id="homePage" class="page active">

      <div class="blue-card rounded-2xl p-5">
        <div class="text-sm text-sky-200">Your FIDEXA Balance</div>

        <div class="balance mt-1">
          <span id="homeBalance">0.00</span>
          <span class="text-lg text-sky-200">FDX</span>
        </div>

        <div class="mt-4 flex justify-between text-xs text-sky-200">
          <span id="userName">Loading...</span>
          <span id="authStatus">Connecting...</span>
        </div>
      </div>

      <div class="mt-5">
        <div class="section-title mb-3">Mining</div>

        <div class="card p-5">
          <div class="flex justify-between items-center">
            <div>
              <div class="font-bold">8-Hour Mining</div>
              <div class="small mt-1">
                Start a mining session every 8 hours.
              </div>
            </div>

            <div class="text-sky-400 text-2xl">⛏</div>
          </div>

          <div class="mt-5 timer" id="homeMiningTimer">
            08:00:00
          </div>

          <div class="mt-4 progress-track">
            <div id="homeMiningProgress" class="progress-bar"></div>
          </div>

          <button
            id="homeMiningButton"
            class="primary-btn mt-4"
            onclick="startMining()"
          >
            START MINING
          </button>

          <div
            id="homeMiningStatus"
            class="small text-center mt-3"
          >
            Ready to start
          </div>

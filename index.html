<script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        
        if (tg.initDataUnsafe?.user?.first_name) {
            document.getElementById('userName').innerText = 'Hey ' + tg.initDataUnsafe.user.first_name + '!';
        }
    }

    // Define Global Controller Variable
    let AdController = null;

    // Helper to safety-check & initialize Adsgram
    function initAdsgram() {
        if (window.Adsgram && !AdController) {
            try {
                AdController = window.Adsgram.init({ blockId: "68773" });
            } catch (e) {
                console.error("Adsgram Init Error:", e);
            }
        }
        return AdController;
    }

    // Try initializing when DOM loads
    document.addEventListener("DOMContentLoaded", () => {
        initAdsgram();
    });

    const BACKEND_URL = "YOUR_FUNCTION_URL_HERE"; 

    async function handleMining() {
        const miningBtn = document.getElementById("miningBtn");
        const miningStatus = document.getElementById("miningStatus");

        // Ensure Adsgram is initialized if it wasn't ready on initial load
        const controller = initAdsgram();

        if (!controller) {
            miningStatus.innerText = "Adsgram SDK not ready. Try again.";
            return;
        }

        try {
            miningStatus.innerText = "Calibrating core...";
            miningBtn.disabled = true;

            // Trigger Adsgram Ad
            const adResult = await controller.show();
            
            // Check if user watched the full ad
            if (adResult && (adResult.done || adResult.state === 'completed')) {
                miningStatus.innerText = "Core stabilized. Verifying claim...";

                const initData = tg?.initData || "";
                
                if (BACKEND_URL === "YOUR_FUNCTION_URL_HERE") {
                    miningStatus.innerText = "System requires activation (Backend URL Missing).";
                    miningBtn.disabled = false;
                    return;
                }

                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData: initData })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    document.getElementById("balanceDisplay").innerText = result.balance;
                    miningStatus.innerText = "Quantum Drive active. Claim processed.";
                    miningBtn.innerHTML = '<i class="fa-solid fa-hourglass-start"></i> Cooldown Active';
                } else {
                    miningStatus.innerText = result.error || "System synchronization failed.";
                    miningBtn.disabled = false;
                }
            } else {
                miningStatus.innerText = "Ad not completed. Reward skipped.";
                miningBtn.disabled = false;
            }
        } catch (err) {
            console.error("Adsgram Show Error:", err);
            // Adsgram throws errors for skipped ads or missing ad inventory
            miningStatus.innerText = "No ads available or ad was skipped. Try again later.";
            miningBtn.disabled = false;
        }
    }
</script>

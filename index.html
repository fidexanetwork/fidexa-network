<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05080c">
<title>Fidexa Network</title>
<style>
:root{--bg:#05080c;--panel:#0a1018;--border:#1b2636;--text:#f1f5f9;--muted:#8899a6;--cyan:#38bdf8;--blue:#0284c7;--yellow:#facc15}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}
button:active{transform:scale(.98)}

.app{max-width:480px;min-height:100vh;margin:auto;padding-bottom:88px;position:relative}
.content{padding:14px 16px;margin-top:10px}

/* Balance Card */
.balance-card{background:linear-gradient(145deg,#0d1520,#080d14);border:1px solid #1b2636;border-radius:18px;padding:18px;position:relative;margin-bottom:18px}
.balance-label{font-size:10px;color:var(--muted);letter-spacing:.8px;font-weight:700}
.balance-row{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.balance-value{font-size:32px;font-weight:900;color:#fff}
.balance-token{font-size:18px;font-weight:800;color:var(--yellow)}
.balance-sub{font-size:11px;color:var(--muted);margin-top:4px;font-weight:700;letter-spacing:.5px}
.balance-dot{position:absolute;top:18px;right:18px;width:8px;height:8px;background:var(--cyan);border-radius:50%;box-shadow:0 0 8px var(--cyan)}

/* Circular Mining Node Section */
.mining-node-container{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px 0 24px}
.ring-wrapper{width:260px;height:260px;border-radius:50%;border:2px solid rgba(56,189,248,0.25);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 0 30px rgba(56,189,248,0.08), inset 0 0 30px rgba(56,189,248,0.08)}
.ring-wrapper::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px dashed rgba(56,189,248,0.4);animation:spin 30s linear infinite}
@keyframes spin { 100% { transform: rotate(360deg); } }

.system-status-pill{background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.3);padding:4px 14px;border-radius:20px;font-size:10px;font-weight:800;color:var(--cyan);letter-spacing:1px;margin-bottom:10px}
.mining-timer{font-size:34px;font-weight:900;letter-spacing:2px;color:#fff}

/* Action Controls Container */
.action-controls{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}

/* Start / Claim Mining Button */
.start-mining-btn{width:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);border:0;border-radius:14px;padding:16px;color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;box-shadow:0 4px 20px rgba(56,189,248,0.3)}

/* Booster Button */
.booster-btn{width:100%;background:rgba(10,16,24,0.9);border:1px solid rgba(250,204,21,0.3);border-radius:14px;padding:12px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.booster-left{display:flex;align-items:center;gap:10px}
.booster-icon{font-size:16px}
.booster-text{text-align:left}
.booster-title{font-size:12px;font-weight:800;color:var(--yellow);letter-spacing:.5px}
.booster-sub{font-size:9px;color:var(--muted);margin-top:2px;font-weight:600}
.booster-badge{background:rgba(250,204,21,0.15);border:1px solid rgba(250,204,21,0.4);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;color:var(--yellow)}

/* Dual Grid Boxes */
.dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.info-box-top{display:flex;align-items:flex-start;justify-content:space-between}
.info-box-label{font-size:10px;color:var(--muted);font-weight:700;line-height:1.3;letter-spacing:.5px}
.info-box-icon{width:28px;height:28px;border-radius:8px;background:#111b27;border:1px solid #223247;display:flex;align-items:center;justify-content:center;font-size:13px}
.info-box-value{font-size:18px;font-weight:800;color:#fff;margin-top:16px}

/* Modal Overlay for Ads & Spin Wheel */
.modal-overlay{position:fixed;inset:0;background:rgba(5,8,12,0.92);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}

/* Ad Simulation Box */
.ad-box{background:var(--panel);border:1px solid var(--border);border-radius:20px;width:100%;max-width:360px;padding:24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
.ad-header{font-size:12px;font-weight:800;color:var(--cyan);letter-spacing:1px;margin-bottom:12px}
.ad-screen{background:#111b27;border:1px solid #223247;border-radius:12px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;position:relative}
.ad-timer-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;color:var(--yellow)}
.ad-title{font-size:14px;font-weight:800;color:#fff;margin-bottom:4px}
.ad-desc{font-size:10px;color:var(--muted)}
.ad-close-btn{width:100%;background:#0284c7;border:0;border-radius:12px;padding:12px;color:#fff;font-size:12px;font-weight:800;opacity:0.5;pointer-events:none;transition:opacity 0.3s}
.ad-close-btn.ready{opacity:1;pointer-events:auto}

/* Spin Wheel Modal Styles */
.spin-box{background:var(--panel);border:1px solid var(--border);border-radius:20px;width:100%;max-width:360px;padding:20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.5);position:relative}
.spin-close{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);font-size:18px;font-weight:bold}
.spin-title{font-size:14px;font-weight:800;color:var(--yellow);margin-bottom:14px;letter-spacing:1px}
.wheel-container{width:260px;height:260px;margin:0 auto 16px;position:relative;border-radius:50%;border:4px solid var(--yellow);box-shadow:0 0 20px rgba(250,204,21,0.2);overflow:hidden;background:#080d14}
.wheel-inner{width:100%;height:100%;position:relative;transition:transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)}
.wheel-segment{position:absolute;width:50%;height:50%;top:0;left:50%;transform-origin:0% 100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;border-left:1px solid rgba(255,255,255,0.15)}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:16px solid var(--yellow);z-index:10}
.spin-action-btn{width:100%;background:linear-gradient(90deg,#facc15,#f59e0b);border:0;border-radius:12px;padding:12px;color:#05080c;font-size:13px;font-weight:900;letter-spacing:1px}

/* Bottom Navigation Bar */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#070b10;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100}
.nav-item{background:none;border:0;color:var(--muted);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.nav-icon{font-size:16px}
.nav-item.active{color:var(--cyan)}
</style>
</head>
<body>

<div class="app">

  <main class="content">

    <!-- Total Balance Card -->
    <div class="balance-card">
      <div class="balance-dot"></div>
      <div class="balance-label">TOTAL BALANCE</div>
      <div class="balance-row">
        <div class="balance-value" id="balanceDisplay">100.00</div>
        <div class="balance-token">$FDX</div>
      </div>
      <div class="balance-sub">$USD</div>
    </div>

    <!-- Circular Timer Node -->
    <div class="mining-node-container">
      <div class="ring-wrapper">
        <div class="system-status-pill" id="systemPill">SYSTEM ACTIVE</div>
        <div class="mining-timer" id="timerDisplay">04:00:00</div>
      </div>
    </div>

    <!-- Action Controls (Button + Booster) -->
    <div class="action-controls">
      <!-- Start / Claim Mining Button -->
      <button class="start-mining-btn" id="miningToggleBtn" onclick="handleMiningAction()">MINING ACTIVE</button>

      <!-- Booster Button -->
      <button class="booster-btn" id="boosterBtn" onclick="watchAdForBoost()">
        <div class="booster-left">
          <div class="booster-icon">🚀</div>
          <div class="booster-text">
            <div class="booster-title">RATE BOOSTER</div>
            <div class="booster-sub">+0.5 mining rate instantly</div>
          </div>
        </div>
        <div class="booster-badge" id="boosterChances">5/5 Left</div>
      </button>
    </div>

    <!-- Dual Metric Cards -->
    <div class="dual-grid">
      <div class="info-box">
        <div class="info-box-top">
          <div class="info-box-label">BURNING<br>STREAK</div>
          <div class="info-box-icon">🔥</div>
        </div>
        <div class="info-box-value" id="burningStreak">0 Days</div>
      </div>
      <div class="info-box">
        <div class="info-box-top">
          <div class="info-box-label">RECOVERABLE<br>$FDX</div>
          <div class="info-box-icon">💎</div>
        </div>
        <div class="info-box-value" id="recoverableFdx">0.00</div>
      </div>
    </div>

  </main>

  <!-- Ad Watch Simulation Modal -->
  <div class="modal-overlay" id="adModal">
    <div class="ad-box">
      <div class="ad-header" id="adHeader">SPONSORED ADVERTISEMENT</div>
      <div class="ad-screen">
        <div class="ad-timer-badge" id="adTimerBadge">Ad in 5s</div>
        <div class="ad-title">Fidexa Partner Network</div>
        <div class="ad-desc" id="adDescText">Watch full video to secure your reward</div>
      </div>
      <button class="ad-close-btn" id="adCloseBtn" onclick="closeAdModal()">CLAIM REWARD</button>
    </div>
  </div>

  <!-- Spin Wheel Modal -->
  <div class="modal-overlay" id="spinModal">
    <div class="spin-box">
      <button class="spin-close" onclick="closeSpinModal()">×</button>
      <div class="spin-title">LUCKY $FDX SPIN</div>
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <div class="wheel-inner" id="wheelInner"></div>
      </div>
      <button class="spin-action-btn" id="spinActionBtn" onclick="spinTheWheel()">SPIN NOW</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active"><span class="nav-icon">⚡</span>Mining</button>
    <button class="nav-item"><span class="nav-icon">📋</span>Tasks</button>
    <button class="nav-item"><span class="nav-icon">👛</span>Wallet</button>
    <button class="nav-item" onclick="openSpinModal()"><span class="nav-icon">🎯</span>Spin</button>
    <button class="nav-item"><span class="nav-icon">🛡️</span>Profile</button>
  </nav>

</div>

<script>
// ============================================================
// FIDEXA MINING — CORE CONSTANTS
// ============================================================

const FOUR_HOURS = 4 * 60 * 60 * 1000;
const BOOST_AMOUNT = 0.5;
const REFERRAL_AMOUNT = 0.1;
const BOOSTER_LIMIT = 5;
const BOOSTER_WINDOW = 24 * 60 * 60 * 1000;

// ============================================================
// FIDEXA MINING — STATE
// ============================================================

const state = {
  homeBalance: 100.00,
  baseRate: 1,
  boosterEvents: [],
  miningStart: Date.now(),
  miningEnd: Date.now() + FOUR_HOURS,
  pendingReward: 0,
  friends: [],
  referralRewards: 0,
  claimedMilestones: {},
  telegramTaskCompleted: false,
  xTaskCompleted: false,
  lucky1Chances: 5,
  lucky1LastReset: 0,
  lucky2Chances: 5,
  lucky2LastReset: 0,
  activeLuckyBox: 1,
  transactions: [],
  telegramUserId: null,
  inactiveDays: 3,
  lostTokenAmount: 45.00,
  recoveryActiveStart: null,
  recoveredClaimedTotal: 0
};

let miningState = 'ACTIVE'; 
let adInterval = null;
let activeAdType = ''; 
let currentSpinReward = '0$FDX';
let totalSeconds = FOUR_HOURS / 1000;

function updateTimerDisplay() {
  if (miningState === 'ACTIVE') {
    if (totalSeconds > 0) {
      totalSeconds--;
      let h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
      let m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
      let s = (totalSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${h}:${m}:${s}`;
    } else {
      miningState = 'READY_TO_CLAIM';
      document.getElementById('timerDisplay').textContent = "00:00:00";
      document.getElementById('systemPill').textContent = "SESSION ENDED";
      document.getElementById('miningToggleBtn').textContent = "CLAIM REWARD";
      document.getElementById('miningToggleBtn').style.background = "linear-gradient(90deg,#facc15,#f59e0b)";
      document.getElementById('miningToggleBtn').style.color = "#05080c";
    }
  }
}
setInterval(updateTimerDisplay, 1000);

function handleMiningAction() {
  if (miningState === 'READY_TO_CLAIM') {
    triggerAd('claim');
  }
}

function watchAdForBoost() {
  if (state.lucky1Chances > 0) {
    triggerAd('booster');
  } else {
    alert("No booster chances left for today!");
  }
}

function triggerAd(type) {
  activeAdType = type;
  const modal = document.getElementById('adModal');
  const closeBtn = document.getElementById('adCloseBtn');
  const timerBadge = document.getElementById('adTimerBadge');
  
  modal.classList.add('active');
  closeBtn.classList.remove('ready');
  closeBtn.textContent = "WATCHING AD...";
  
  let adCountdown = 4;
  timerBadge.textContent = `Ad in ${adCountdown}s`;
  
  if (adInterval) clearInterval(adInterval);
  
  adInterval = setInterval(() => {
    adCountdown--;
    if (adCountdown > 0) {
      timerBadge.textContent = `Ad in ${adCountdown}s`;
    } else {
      timerBadge.textContent = "Ad Finished";
      clearInterval(adInterval);
      closeBtn.classList.add('ready');
      if (type === 'spin') {
        closeBtn.textContent = `WATCH ADS TO CLAIM (${currentSpinReward})`;
      } else if (type === 'claim') {
        closeBtn.textContent = "CLAIM REWARD TO BALANCE";
      } else {
        closeBtn.textContent = `COLLECT +${BOOST_AMOUNT} RATE`;
      }
    }
  }, 1000);
}

function closeAdModal() {
  const modal = document.getElementById('adModal');
  modal.classList.remove('active');
  
  if (activeAdType === 'booster') {
    state.lucky1Chances--;
    state.baseRate += BOOST_AMOUNT;
    document.getElementById('boosterChances').textContent = `${state.lucky1Chances}/${BOOSTER_LIMIT} Left`;
    alert(`Success! Mining rate increased by +${BOOST_AMOUNT}.`);
  } else if (activeAdType === 'claim') {
    let minedReward = (FOUR_HOURS / 3600000) * state.baseRate;
    state.homeBalance += minedReward;
    document.getElementById('balanceDisplay').textContent = state.homeBalance.toFixed(2);
    
    totalSeconds = FOUR_HOURS / 1000;
    miningState = 'ACTIVE';
    state.miningStart = Date.now();
    state.miningEnd = Date.now() + FOUR_HOURS;
    
    document.getElementById('systemPill').textContent = "SYSTEM ACTIVE";
    document.getElementById('miningToggleBtn').textContent = "MINING ACTIVE";
    document.getElementById('miningToggleBtn').style.background = "linear-gradient(90deg,#0284c7,#38bdf8)";
    document.getElementById('miningToggleBtn').style.color = "#fff";
  } else if (activeAdType === 'spin') {
    let numericVal = parseFloat(currentSpinReward) || 0;
    state.homeBalance += numericVal;
    document.getElementById('balanceDisplay').textContent = state.homeBalance.toFixed(2);
    alert(`Successfully added ${currentSpinReward} to your Total Balance!`);
  }
}

// Spin Wheel Configuration
const spinRewards = ['0$FDX', '1$FDX', '5$FDX', '10$FDX', '15$FDX', '30$FDX'];
const wheelColors = ['#0284c7', '#0369a1', '#0284c7', '#0369a1', '#0284c7', '#0369a1'];

function buildWheel() {
  const wheelInner = document.getElementById('wheelInner');
  wheelInner.innerHTML = '';
  const angleStep = 360 / spinRewards.length;
  
  spinRewards.forEach((reward, index) => {
    const seg = document.createElement('div');
    seg.className = 'wheel-segment';
    seg.style.transform = `rotate(${index * angleStep}deg) skewY(-30deg)`;
    seg.style.backgroundColor = wheelColors[index % wheelColors.length];
    seg.innerHTML = `<span style="transform: skewY(30deg) rotate(30deg); display:inline-block; font-size:13px; font-weight:900; color:#facc15; text-shadow:0 1px 2px rgba(0,0,0,0.8);">${reward}</span>`;
    wheelInner.appendChild(seg);
  });
}

function openSpinModal() {
  document.getElementById('spinModal').classList.add('active');
  buildWheel();
}

function closeSpinModal() {
  document.getElementById('spinModal').classList.remove('active');
}

let currentRotation = 0;
function spinTheWheel() {
  const btn = document.getElementById('spinActionBtn');
  btn.style.pointerEvents = 'none';
  btn.textContent = "SPINNING...";
  
  const randomIndex = Math.floor(Math.random() * spinRewards.length);
  currentSpinReward = spinRewards[randomIndex];
  
  const angleStep = 360 / spinRewards.length;
  const extraSpins = 5 * 360; 
  const targetAngle = currentRotation + extraSpins + (360 - (randomIndex * angleStep + angleStep / 2));
  currentRotation = targetAngle;
  
  const wheelInner = document.getElementById('wheelInner');
  wheelInner.style.transform = `rotate(${currentRotation}deg)`;
  
  setTimeout(() => {
    btn.style.pointerEvents = 'auto';
    btn.textContent = "SPIN NOW";
    closeSpinModal();
    triggerAd('spin');
  }, 4000);
}
</script>

</body>
</html>

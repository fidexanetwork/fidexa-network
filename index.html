<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidexa Network</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library with safety check -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: sans-serif; }
        .glow { box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-16">

    <!-- Top Header -->
    <header class="flex justify-between items-center p-4 border-b border-gray-800">
        <span class="text-lg font-bold">Fidexa Network</span>
        <div id="connectionStatus" class="text-xs text-yellow-500">Connecting...</div>
    </header>

    <!-- Main Content App Container -->
    <main class="flex-1 flex flex-col items-center p-4 max-w-md mx-auto w-full space-y-4">
        
        <!-- Total Balance Card -->
        <div class="w-full bg-[#121824] p-4 rounded-xl border border-gray-800">
            <div class="text-xs text-gray-400 font-semibold tracking-wider">TOTAL BALANCE</div>
            <div class="text-3xl font-extrabold text-amber-400 mt-1"><span id="totalBalance">0.00</span> <span class="text-sm font-normal text-white">$FDX</span></div>
        </div>

        <!-- Mining Session Circle Area -->
        <div class="relative flex flex-col items-center justify-center w-64 h-64 rounded-full border-4 border-dashed border-cyan-500/40 bg-[#121824]/50 my-2">
            <div id="sessionBadge" class="text-xs bg-cyan-950 text-cyan-400 px-3 py-1 rounded-full uppercase tracking-wider font-bold mb-2 border border-cyan-800">Session Ended</div>
            <div id="timerDisplay" class="text-4xl font-black tracking-tight text-white">04:00:00</div>
            <div class="text-xs text-gray-400 mt-2">Mining Rate: <span class="text-amber-400 font-semibold">1.5 $FDX/H</span></div>
        </div>

        <!-- Action Button -->
        <button id="actionButton" onclick="handleMiningAction()" class="w-full py-4 bg-amber-400 text-gray-950 font-bold rounded-xl text-lg shadow-lg hover:bg-amber-300 transition-all">
            CLAIM REWARD
        </button>

        <!-- Boost & Lucky Box Grid -->
        <div class="grid grid-cols-2 gap-3 w-full">
            <div class="bg-[#121824] p-3 rounded-xl border border-gray-800 flex flex-col justify-between">
                <div class="text-xs font-bold text-gray-300">Mining Boost</div>
                <div class="text-[10px] text-gray-400 mt-1">4/5 Left</div>
            </div>
            <div class="bg-[#121824] p-3 rounded-xl border border-gray-800 flex flex-col justify-between">
                <div class="text-xs font-bold text-gray-300">Lucky Box</div>
                <div class="text-[10px] text-gray-400 mt-1">5 chances / 4 hours</div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-[#1b2230] border border-cyan-500/50 text-cyan-300 px-4 py-2 rounded-xl text-xs shadow-xl hidden transition-opacity duration-300 z-50 text-center max-w-xs w-full">
        Network error connecting to backend.
    </div>

    <!-- Fixed Bottom Navigation Bar (Fixed overlap bug) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0f141d] border-t border-gray-800 flex justify-around items-center h-16 px-2 z-40">
        <button class="flex flex-col items-center text-amber-400 text-xs focus:outline-none">
            <span class="text-lg">⚡</span>
            <span class="text-[10px] mt-0.5 font-medium">Mining</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 text-xs focus:outline-none">
            <span class="text-lg">📋</span>
            <span class="text-[10px] mt-0.5 font-medium">Tasks</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 text-xs focus:outline-none">
            <span class="text-lg">👥</span>
            <span class="text-[10px] mt-0.5 font-medium">Friends</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 text-xs focus:outline-none">
            <span class="text-lg">👛</span>
            <span class="text-[10px] mt-0.5 font-medium">Wallet</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 text-xs focus:outline-none">
            <span class="text-lg">🛡️</span>
            <span class="text-[10px] mt-0.5 font-medium">Profile</span>
        </button>
    </nav>

    <script>
        const BACKEND_URL = "https://fidexa-backend.onrender.com";
        let userInitData = window.Telegram?.WebApp?.initData || "";

        // UI Toast helper with graceful handling
        function showToast(message, isError = true) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-xl text-xs shadow-xl z-50 text-center max-w-xs w-full transition-opacity duration-300 ${isError ? 'bg-red-950/90 border border-red-500 text-red-200' : 'bg-[#1b2230] border border-cyan-500/50 text-cyan-300'}`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 4000);
        }

        // Safe backend data fetcher guarding against Render cold-starts
        async function syncWithBackend() {
            const statusEl = document.getElementById('connectionStatus');
            try {
                const response = await fetch(`${BACKEND_URL}/api/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${userInitData}`,
                        'X-Telegram-Init-Data': userInitData,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();
                statusEl.innerText = "Connected";
                statusEl.className = "text-xs text-green-500";
                
                // Update balance if returned successfully
                if (data.balance !== undefined) {
                    document.getElementById('totalBalance').innerText = Number(data.balance).toFixed(2);
                }
            } catch (error) {
                console.warn("Backend connection issue (likely cold start):", error);
                statusEl.innerText = "Offline Mode";
                statusEl.className = "text-xs text-red-400";
                showToast("Network error connecting to backend. Retrying in background...");
            }
        }

        function handleMiningAction() {
            showToast("Processing request with backend...", false);
            // Implement your mining claim/start dispatch hook here safely
        }

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            syncWithBackend();
            // Refresh connection sync every 60 seconds
            setInterval(syncWithBackend, 60000);
        });
    </script>
</body>
</html>

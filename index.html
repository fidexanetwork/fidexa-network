<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fidexa Network</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad-index.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 350px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .balance-title {
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .balance-amount {
      font-size: 36px;
      font-weight: bold;
      color: #38bdf8;
      margin: 12px 0 24px 0;
    }
    .btn {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Fidexa Network</h1>
    <div class="balance-title">Your Balance</div>
    <div class="balance-amount" id="balance">0 FD...</div>

    <button class="btn" id="claimBtn" onclick="handleClaim()">Claim Reward / Start Mining</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Initialize Adsgram Controller with your Block ID
    const AdController = window.Adsgram?.init({ blockId: "68773" });

    // Function URL will be pasted here after deployment
    const BACKEND_URL = "YOUR_FUNCTION_URL_HERE"; 

    async function handleClaim() {
      const claimBtn = document.getElementById("claimBtn");
      const statusMsg = document.getElementById("statusMsg");

      if (!AdController) {
        statusMsg.innerText = "Adsgram SDK not loaded.";
        return;
      }

      try {
        // Step 1: Trigger Adsgram Ad
        const adResult = await AdController.show();
        
        if (adResult && adResult.done) {
          statusMsg.innerText = "Ad completed! Verifying with server...";
          claimBtn.disabled = true;

          // Step 2: Call secure Cloud Function backend
          const initData = tg?.initData || "";
          
          const response = await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: initData })
          });

          const result = await response.json();

          if (response.ok && result.success) {
            document.getElementById("balance").innerText = result.balance + " FD";
            statusMsg.innerText = "Reward claimed successfully!";
          } else {
            statusMsg.innerText = result.error || "Failed to process reward.";
            claimBtn.disabled = false;
          }
        }
      } catch (err) {
        console.error("Ad error or closed:", err);
        statusMsg.innerText = "Ad was not completed. Reward not claimed.";
      }
    }
  </script>
</body>
</html>

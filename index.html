 <script>
    // Initialize Telegram WebApp   <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            
            if (tg.initDataUnsafe?.user?.first_name) {
                document.getElementById('userName').innerText = 'Hey ' + tg.initDataUnsafe.user.first_name + '!';
            }
        }

        // Initialize Adsgram Controller with your block ID: 49196
        const AdController = window.Adsgram?.init({ blockId: "49196" });

        const BACKEND_URL = "YOUR_FUNCTION_URL_HERE"; 

        async function handleMining(rewardAmount = 3.22, statusMsgId = "miningStatus", btnId = "miningBtn") {
            const statusEl = document.getElementById(statusMsgId);
            const btnEl = btnId ? document.getElementById(btnId) : null;

            if (!AdController) {
                if (statusEl) statusEl.innerText = "Adsgram SDK not ready. Try again.";
                return;
            }

            try {
                if (statusEl) statusEl.innerText = "Opening Ad...";
                if (btnEl) btnEl.disabled = true;

                const adResult = await AdController.show();
                
                if (adResult && adResult.done) {
                    if (statusEl) statusEl.innerText = "Ad completed! Verifying claim...";

                    const initData = tg?.initData || "";
                    
                    if (BACKEND_URL === "YOUR_FUNCTION_URL_HERE") {
                        // Client-side fallback simulation
                        let currentBal = parseFloat(document.getElementById("balanceDisplay").innerText.replace(/,/g, ''));
                        currentBal += parseFloat(rewardAmount);
                        document.getElementById("balanceDisplay").innerText = currentBal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        if (statusEl) statusEl.innerText = `Reward added (+${rewardAmount} FDX)!`;
                        if (btnEl) btnEl.disabled = false;
                        return;
                    }

                    const response = await fetch(BACKEND_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ initData: initData, reward: rewardAmount })
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        document.getElementById("balanceDisplay").innerText = result.balance;
                        if (statusEl) statusEl.innerText = `Reward added (+${rewardAmount} FDX)!`;
                    } else {
                        if (statusEl) statusEl.innerText = result.error || "Synchronization failed.";
                    }
                } else {
                    if (statusEl) statusEl.innerText = "Ad skipped or incomplete.";
                }
            } catch (err) {
                console.error("Ad cancelled or error:", err);
                if (statusEl) statusEl.innerText = "Claim canceled.";
            } finally {
                if (btnEl) btnEl.disabled = false;
            }
        }
    </script>

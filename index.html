<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIDEXA Network — Next-Gen Technology Platform</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FIDEXA Next-Gen Visual Identity Stylesheet -->
  <style>
    :root {
      --bg-primary: #030712;
      --bg-surface: #0B132B;
      --bg-card: rgba(11, 19, 43, 0.75);
      --accent-cyan: #00F0FF;
      --accent-gold: #D4AF37;
      --accent-gold-gradient: linear-gradient(135deg, #FFDF73 0%, #D4AF37 50%, #AA7C11 100%);
      --accent-diamond: #E2E8F0;
      --border-cyan: rgba(0, 240, 255, 0.25);
      --border-diamond: rgba(226, 232, 240, 0.15);
      --border-gold: rgba(212, 175, 55, 0.3);
      --shadow-futuristic: 0 0 20px rgba(0, 240, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--accent-diamond);
      font-family: var(--font-main);
    }

    .fidexa-app-container {
      background-color: var(--bg-primary);
      color: var(--accent-diamond);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-cyan);
      border-radius: 16px;
      box-shadow: var(--shadow-futuristic);
    }

    .gold-text {
      background: var(--accent-gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .diamond-text {
      color: var(--accent-diamond);
      font-weight: 600;
    }

    .label-muted {
      font-size: 11px;
      letter-spacing: 1.2px;
      color: rgba(226, 232, 240, 0.6);
      text-transform: uppercase;
    }

    .fidexa-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .brand-identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fidexa-logo-mark {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent-cyan), #0055FF);
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFFFFF;
    }

    .profile-support-nav {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-diamond);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: var(--accent-diamond);
    }

    .balance-card {
      padding: 20px;
      margin: 12px 0;
      border-color: var(--border-gold);
    }

    .balance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .network-status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .balance-display {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .balance-display h1 {
      font-size: 36px;
      margin: 0;
    }

    .currency-tag {
      font-size: 14px;
      color: var(--accent-gold);
      font-weight: 700;
      padding-bottom: 2px;
    }

    .balance-subtext {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(226, 232, 240, 0.7);
    }

    .mining-centerpiece-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0;
    }

    .mining-core-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .mining-energy-ring {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(11, 19, 43, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .status-badge {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      margin-bottom: 8px;
    }

    .timer-display {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 1px;
      font-family: monospace;
    }

    .mining-instruction {
      font-size: 11px;
      color: rgba(226, 232, 240, 0.6);
      max-width: 160px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .fidexa-btn-cyan {
      background: linear-gradient(135deg, #00F0FF 0%, #0088CC 100%);
      color: #030712;
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      max-width: 240px;
    }

    .fidexa-btn-cyan:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 240, 255, 0.6);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-card {
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }

    .metric-card:hover {
      border-color: var(--accent-cyan);
    }

    .metric-info h3 {
      margin: 4px 0 0 0;
      font-size: 16px;
    }

    .metric-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-diamond);
    }

    .metric-icon-wrap.cyan-glow svg { fill: var(--accent-cyan); }
    .metric-icon-wrap.gold-glow svg { fill: var(--accent-gold); }

    .icon-sm {
      width: 18px;
      height: 18px;
    }

    .fidexa-bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-radius: 16px;
    }

    .nav-item {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .nav-item.active {
      opacity: 1;
    }

    .nav-item.active .nav-label {
      color: var(--accent-cyan);
    }

    .nav-icon {
      font-size: 18px;
    }

    .nav-label {
      font-size: 10px;
      letter-spacing: 0.5px;
      color: var(--accent-diamond);
    }
  </style>
</head>
<body>

  <div class="fidexa-app-container">
    
    <!-- Top Header Navigation -->
    <header class="fidexa-header">
      <div class="brand-identity">
        <div class="fidexa-logo-mark"></div>
        <span class="brand-name">FIDEXA</span>
      </div>
      <div class="profile-support-nav">
        <button class="icon-btn" id="supportBtn" aria-label="Support">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
        </button>
        <button class="icon-btn" id="profileBtn" aria-label="Profile">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
      </div>
    </header>

    <!-- FDX Balance Overview Card -->
    <section class="balance-card glass-panel">
      <div class="balance-header">
        <span class="label-muted">TOTAL FDX BALANCE</span>
        <span class="network-status-dot active"></span>
      </div>
      <div class="balance-display">
        <h1 id="fdxBalanceValue" class="gold-text">0.00</h1>
        <span class="currency-tag">FDX</span>
      </div>
      <div class="balance-subtext">
        <span>Value Ecosystem: <strong class="diamond-text">Active Tier 1</strong></span>
      </div>
    </section>

    <!-- Mining Centerpiece Section -->
    <main class="mining-centerpiece-section">
      <div class="mining-core-wrapper">
        <div class="mining-energy-ring" id="miningProgressRing">
          <div class="core-inner-glow"></div>
          <div class="mining-status-content">
            <div class="status-badge" id="miningStatusBadge">SYSTEM READY</div>
            <div class="timer-display" id="miningTimer">00:00:00</div>
            <p class="mining-instruction" id="miningInstructionText">Tap below to initiate digital node generation</p>
          </div>
        </div>

        <button class="fidexa-btn-cyan" id="miningActionBtn">
          <span>START MINING</span>
        </button>
      </div>
    </main>

    <!-- Secondary Metrics (Referrals & Tasks) -->
    <section class="metrics-grid">
      <div class="metric-card glass-panel" id="referralCardTrigger">
        <div class="metric-info">
          <span class="label-muted">REFERRAL NETWORK</span>
          <h3 class="diamond-text" id="referralCount">0 Nodes</h3>
        </div>
        <div class="metric-icon-wrap cyan-glow">
          <svg viewBox="0 0 24 24" class="icon-sm"><path d="M16 11c1.66 0 2.99-1.34 2.99-2S17.66 7 16 7c-1.66 0-2.99 1.34-2.99 2s1.33 2 2.99 2zm-8 0c1.66 0 2.99-1.34 2.99-2S9.66 7 8 7C6.34 7 5 8.34 5 10s1.34 2 3 2zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>
      </div>

      <div class="metric-card glass-panel" id="tasksCardTrigger">
        <div class="metric-info">
          <span class="label-muted">ECOSYSTEM TASKS</span>
          <h3 class="gold-text" id="completedTasksCount">0 / 0</h3>
        </div>
        <div class="metric-icon-wrap gold-glow">
          <svg viewBox="0 0 24 24" class="icon-sm"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
      </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="fidexa-bottom-nav glass-panel">
      <button class="nav-item active" data-target="mining">
        <span class="nav-icon">⚡</span>
        <span class="nav-label">Mining</span>
      </button>
      <button class="nav-item" data-target="tasks">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Tasks</span>
      </button>
      <button class="nav-item" data-target="referrals">
        <span class="nav-icon">🌐</span>
        <span class="nav-label">Network</span>
      </button>
      <button class="nav-item" data-target="profile">
        <span class="nav-icon">🛡️</span>
        <span class="nav-label">Profile</span>
      </button>
    </nav>

  </div>

  <!-- FIDEXA Interface Hook Script (Integrates with your existing Firebase/Telegram/AdsGram logic bindings) -->
  <script>
    // Hook bindings preserving existing core logic execution flow
    document.addEventListener("DOMContentLoaded", () => {
      // Example visual state sync hook
      window.FidexaUI = {
        updateBalance: (amount) => {
          document.getElementById('fdxBalanceValue').innerText = Number(amount).toFixed(2);
        },
        setMiningActiveState: (active, timeLeftStr) => {
          const badge = document.getElementById('miningStatusBadge');
          const timer = document.getElementById('miningTimer');
          const btn = document.getElementById('miningActionBtn');
          
          if (active) {
            badge.innerText = "NODE MINING ACTIVE";
            timer.innerText = timeLeftStr;
            btn.querySelector('span').innerText = "MINING IN PROGRESS";
          } else {
            badge.innerText = "SYSTEM READY";
            timer.innerText = "00:00:00";
            btn.querySelector('span').innerText = "START MINING";
          }
        }
      };
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Palette Dashboard</title>
    <style>
        :root {
            --bg: #05070D;          /* Deep Space */
            --midnight: #0A1020;    /* Midnight */
            --panel: #0D1628;       /* Premium Card */
            --border: #162642;      /* Structural Border */
            --text: #F5FBFF;        /* Diamond White */
            --muted: #A9B7C9;       /* Silver Text */
            --cyan: #00D9FF;        /* Electric Cyan */
            --blue: #1677FF;        /* Neon Blue */
            --gold: #FFD700;        /* Digital Gold */
            --ice: #B9EEFF;         /* Ice Blue */
            --success: #20E68A;     /* Success Green */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, var(--midnight) 0%, var(--bg) 75%);
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--midnight);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            color: var(--cyan);
        }

        .status-badge {
            background-color: rgba(32, 230, 138, 0.1);
            color: var(--success);
            border: 1px solid rgba(32, 230, 138, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--cyan);
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 0.9rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }

        .card-value.gold {
            color: var(--gold);
        }

        .card-value.cyan {
            color: var(--cyan);
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--ice);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--blue);
            color: var(--text);
            box-shadow: 0 4px 14px rgba(22, 119, 275, 0.3);
        }

        .btn-primary:hover {
            background-color: #2684ff;
            box-shadow: 0 6px 20px rgba(22, 119, 275, 0.5);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
        }

        .btn-outline:hover {
            background-color: rgba(0, 217, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header Section -->
        <div class="header">
            <h1><span>//</span> System Overview</h1>
            <div class="status-badge">
                <div class="status-dot"></div>
                Systems Online
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="grid">
            <div class="card">
                <div class="card-title">Total Balance</div>
                <div class="card-value gold">$245,890.00</div>
                <div class="card-desc">+14.2% from last month</div>
            </div>
            <div class="card">
                <div class="card-title">Active Nodes</div>
                <div class="card-value cyan">1,428</div>
                <div class="card-desc">Optimal routing performance</div>
            </div>
            <div class="card">
                <div class="card-title">Efficiency Rate</div>
                <div class="card-value" style="color: var(--success);">99.8%</div>
                <div class="card-desc">Zero downtime recorded</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <button class="btn btn-primary" onclick="triggerAction('Deploy')">Deploy Changes</button>
            <button class="btn btn-outline" onclick="triggerAction('Refresh')">Refresh Data</button>
        </div>
    </div>

    <script>
        function triggerAction(actionName) {
            console.log(actionName + " action triggered successfully.");
            alert(actionName + " sequence initialized.");
        }
    </script>
</body>
</html>
